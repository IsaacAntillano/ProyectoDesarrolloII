spring.application.name=victus-caf-backend

# Carga backend/.env (gitignored) como si fueran properties.
# El .env.example documenta las variables; nunca commitear el .env real.
spring.config.import=optional:file:.env[.properties]

# ─── Base de datos ───
# Las credenciales reales van en backend/.env (gitignored).
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/victus_caf_db?useSSL=false&serverTimezone=America/Bogota}
spring.datasource.username=${DB_USERNAME:victus_app}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# El esquema lo genera Hibernate a partir de los entities (InheritanceType.JOINED).
# No hay migraciones: no usar 'validate' ni 'none' contra una base recien creada.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ─── Puerto ───
server.port=${SERVER_PORT:8080}

# ─── JWT ───
# Clave HMAC-SHA512 (minimo 64 bytes = 512 bits). Mover a JWT_SECRET en produccion.
app.jwtSecret=${JWT_SECRET:victus-caf-clave-secreta-para-jwt-hmac512-minimo-64-bytes!!aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa}
app.jwtExpirationMs=${JWT_EXPIRATION_MS:86400000}

# ─── Autorizacion por header ───
# El frontend envia el rol en X-Rol y el backend construye el SecurityContext
# a partir de ese valor. Ver RolHeaderFilter.
#
# ATENCION: esto NO es autenticacion. Cualquiera que alcance el puerto 8080
# puede declarar X-Rol: ADMINISTRADOR y obtener permisos de administrador.
# Es aceptable unicamente en desarrollo local. No exponer en red.
app.security.header-rol=X-Rol
app.security.header-documento=X-Documento
app.security.roles-permitidos=ADMINISTRADOR,SECRETARIA,ENTRENADOR,CLIENTE

# Origenes permitidos para el navegador en desarrollo (Vite corre en 5173).
app.security.allowed-origins=http://localhost:5173,http://127.0.0.1:5173